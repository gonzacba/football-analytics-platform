version: 2

models:
  - name: stg_events
    description: "Cleaned and renamed StatsBomb match events"
    columns:
      - name: event_id
        description: "Unique event identifier"
        tests:
          - unique
          - not_null
      - name: match_id
        description: "Match identifier"
        tests:
          - not_null
      - name: period
        description: "Match period"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: event_type
        description: "Type of event"
        tests:
          - not_null