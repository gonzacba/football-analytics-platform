version: 2

models:
  - name: mart_player_performance
    description: "Player performance metrics aggregated per match"
    columns:
      - name: player_name
        description: "Player name"
        tests:
          - not_null
      - name: match_id
        description: "Match identifier"
        tests:
          - not_null

  - name: mart_team_summary
    description: "Team performance metrics aggregated per match"
    columns:
      - name: team_name
        description: "Team name"
        tests:
          - not_null
      - name: match_id
        description: "Match identifier"
        tests:
          - not_null

  - name: mart_shot_analysis
    description: "Individual shot records with enriched context"
    columns:
      - name: event_id
        description: "Unique shot event identifier"
        tests:
          - unique
          - not_null
    
  - name: mart_pass_networks
    description: "Pass network connections between player pairs per match"
    columns:
      - name: passer_name
        description: "Player making the pass"
        tests:
          - not_null
      - name: recipient_name
        description: "Player receiving the pass"
        tests:
          - not_null
      - name: match_id
        description: "Match identifier"
        tests:
          - not_null
      - name: total_passes
        description: "Total passes between this player pair in this match"
        tests:
          - not_null